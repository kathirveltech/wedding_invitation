<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vignesh &amp; Nandhini — Save the Date, 13 Sep 2026</title>
    <meta
      name="description"
      content="Vignesh R weds Nandhini R on 13 September 2026 at Agathiyan Thirumana Mandapam, Karaikudi. With love, we invite you to share our day."
    />

    <!-- ============================================================
         Link preview (WhatsApp / Facebook / iMessage / Teams / X).

         All these URLs MUST stay absolute https URLs on the live
         domain. A relative path or a stale domain makes WhatsApp fall
         back to the bare link with no preview. If the site moves to a
         custom domain, update every one of them.

         og:image is the PORTRAIT save-the-date (1200x1800). WhatsApp
         picks its card layout from the aspect ratio: a tall image
         gets the big photo beside the text, a 1.91:1 image gets a
         short letterboxed banner. Keep it portrait and under ~600KB
         or WhatsApp silently drops it. X wants the 1.91:1 crop, so
         twitter:image stays on og-image.jpg.

         VERSION BY FILENAME, NOT ?query. Share the invitation as
         /invite (see vercel.json), never as the bare domain. WhatsApp
         caches one preview per exact URL for ~7 days with no purge
         API, so a URL it has already crawled can never be corrected —
         only replaced. If the card ever needs changing again, save a
         new og-invite-v3.jpg and hand out a new path (/invite2).
         ============================================================ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vignesh weds Nandhini" />
    <meta
      property="og:url"
      content="https://vignesh-weds-nandhini.vercel.app/invite"
    />
    <meta
      property="og:title"
      content="Vignesh &amp; Nandhini — Save the Date, 13 Sep 2026"
    />
    <meta
      property="og:description"
      content="Vignesh R weds Nandhini R on 13 September 2026 at Agathiyan Thirumana Mandapam, Karaikudi. With love, we invite you to share our day."
    />
    <meta
      property="og:image"
      content="https://vignesh-weds-nandhini.vercel.app/og-invite-v2.jpg"
    />
    <meta
      property="og:image:secure_url"
      content="https://vignesh-weds-nandhini.vercel.app/og-invite-v2.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1800" />
    <meta
      property="og:image:alt"
      content="Vignesh and Nandhini holding a sunflower together — Save the Date 13-09-2026"
    />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Vignesh &amp; Nandhini — Save the Date, 13 Sep 2026"
    />
    <meta
      name="twitter:description"
      content="Vignesh R weds Nandhini R on 13 September 2026 at Agathiyan Thirumana Mandapam, Karaikudi. With love, we invite you to share our day."
    />
    <meta
      name="twitter:image"
      content="https://vignesh-weds-nandhini.vercel.app/og-image.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="Vignesh and Nandhini holding a sunflower together — Save the Date 13-09-2026"
    />

    <meta name="theme-color" content="#f5b301" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
